<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A focused Supabase task manager." />
  <title>Task Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ink: #20302d;
      --muted: #6e7c78;
      --paper: #f7f6f0;
      --panel: #fffef9;
      --line: #dfe5de;
      --mint: #b8d9c5;
      --mint-dark: #2b6a4a;
      --coral: #df725c;
      --shadow: 0 18px 45px rgba(38, 63, 54, 0.09);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px 0;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; gap: 12px; align-items: center; }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--mint-dark);
      background: var(--mint);
      border-radius: 12px 12px 12px 3px;
      font: 700 21px Arial, sans-serif;
    }
    .brand-name { font-size: 22px; letter-spacing: -0.03em; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--mint-dark);
      font: 700 11px Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .muted { color: var(--muted); }
    .button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      color: #fff;
      background: var(--mint-dark);
      font: 700 13px Arial, sans-serif;
      transition: transform 160ms ease, background 160ms ease;
    }
    .button:hover { background: #20583d; transform: translateY(-1px); }
    .button.secondary { color: var(--ink); background: #edf1eb; }
    .button.secondary:hover { background: #e2e9e2; }
    .button.danger { color: #9a4536; background: #fae9e4; }
    .button.small { padding: 8px 11px; font-size: 12px; }
    .hidden { display: none !important; }
    .notice {
      margin: 18px 0 0;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 254, 249, 0.72);
      font: 13px/1.5 Arial, sans-serif;
    }
    .notice.error { color: #9a4536; border-color: #f1c8bf; background: #fff6f3; }
    .notice.success { color: var(--mint-dark); border-color: #c4dfcd; background: #f3fbf5; }

    #auth-view { padding: 74px 0 96px; }
    .auth-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 80px;
      align-items: center;
    }
    .intro h1 {
      max-width: 560px;
      margin: 0;
      font-size: clamp(42px, 6vw, 76px);
      line-height: 0.98;
      letter-spacing: -0.06em;
      font-weight: 400;
    }
    .intro-copy { max-width: 430px; margin: 26px 0 0; color: var(--muted); font: 16px/1.65 Arial, sans-serif; }
    .auth-panel, .task-form, .task-list { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .auth-panel { padding: 28px; }
    .tabs { display: flex; gap: 22px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
    .tab {
      padding: 0 0 12px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font: 700 13px Arial, sans-serif;
    }
    .tab.active { color: var(--ink); border-bottom: 2px solid var(--coral); }
    .form-stack { display: grid; gap: 15px; }
    label { display: grid; gap: 7px; color: var(--muted); font: 700 11px Arial, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 13px 14px;
      color: var(--ink);
      outline: none;
      background: #fbfcf8;
      font: 15px/1.4 Arial, sans-serif;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--mint-dark); box-shadow: 0 0 0 3px rgba(184, 217, 197, 0.35); }
    textarea { min-height: 104px; resize: vertical; }

    #app-view { padding: 42px 0 80px; }
    .app-heading { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 30px; }
    .app-heading h1 { margin: 0; font-size: clamp(34px, 5vw, 54px); letter-spacing: -0.05em; font-weight: 400; }
    .user-line { margin: 8px 0 0; color: var(--muted); font: 13px Arial, sans-serif; }
    .workspace { display: grid; grid-template-columns: minmax(260px, 0.72fr) minmax(0, 1.28fr); gap: 24px; align-items: start; }
    .task-form { padding: 24px; }
    .task-form h2, .task-list h2 { margin: 0 0 20px; font-size: 23px; font-weight: 400; letter-spacing: -0.03em; }
    .task-form .button { width: 100%; margin-top: 4px; }
    .task-list { min-height: 300px; padding: 24px; }
    .list-header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .sort-control { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .sort-control select { width: auto; padding: 7px 9px; color: var(--ink); font-size: 12px; }
    .task-count { color: var(--muted); font: 12px Arial, sans-serif; }
    #tasks { display: grid; gap: 10px; }
    .task {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    .task-check { width: 19px; height: 19px; margin-top: 2px; accent-color: var(--mint-dark); }
    .task-title { margin: 0; font-size: 17px; line-height: 1.25; }
    .task-description { margin: 6px 0 0; color: var(--muted); font: 13px/1.5 Arial, sans-serif; white-space: pre-wrap; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .task-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 8px; font: 700 10px Arial, sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }
    .task-badge.priority-high { color: #9a4536; background: #fae9e4; }
    .task-badge.priority-medium { color: #86651d; background: #f8efd2; }
    .task-badge.priority-low { color: var(--mint-dark); background: #e3f1e7; }
    .task-badge.due-date { color: var(--muted); background: #edf1eb; }
    .task.completed .task-title { color: var(--muted); text-decoration: line-through; }
    .task-actions { display: flex; gap: 6px; }
    .icon-button { border: 0; padding: 5px; color: var(--muted); background: transparent; font: 12px Arial, sans-serif; }
    .icon-button:hover { color: var(--coral); }
    .empty { padding: 38px 0 18px; color: var(--muted); text-align: center; font: 14px/1.5 Arial, sans-serif; }
    .loading { color: var(--muted); font: 13px Arial, sans-serif; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 560px); }
      .topbar { padding: 18px 0; }
      #auth-view { padding: 48px 0 70px; }
      .auth-layout, .workspace { grid-template-columns: 1fr; gap: 30px; }
      .intro h1 { font-size: 51px; }
      .app-heading { align-items: start; flex-direction: column; }
      .task { grid-template-columns: auto 1fr; }
      .task-actions { grid-column: 2; }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <div class="brand"><span class="brand-mark">✓</span><span class="brand-name">Task Manager</span></div>
    <button id="logout-button" class="button secondary hidden" type="button">Log out</button>
  </header>

  <main class="shell">
    <section id="auth-view">
      <div class="auth-layout">
        <div class="intro">
          <p class="eyebrow">A quieter way to get things done</p>
          <h1>Make room for what matters next.</h1>
          <p class="intro-copy">Keep the moving pieces of your day in one considered, uncomplicated place.</p>
        </div>
        <div class="auth-panel">
          <div class="tabs" role="tablist" aria-label="Account actions">
            <button class="tab active" data-auth-tab="login" type="button">Log in</button>
            <button class="tab" data-auth-tab="signup" type="button">Create account</button>
          </div>
          <form id="login-form" class="form-stack">
            <label>Email<input id="login-email" type="email" autocomplete="email" required /></label>
            <label>Password<input id="login-password" type="password" autocomplete="current-password" required /></label>
            <button class="button" type="submit">Log in</button>
          </form>
          <form id="signup-form" class="form-stack hidden">
            <label>Email<input id="signup-email" type="email" autocomplete="email" required /></label>
            <label>Password<input id="signup-password" type="password" autocomplete="new-password" minlength="6" required /></label>
            <button class="button" type="submit">Create account</button>
          </form>
          <div id="auth-message" class="notice hidden" role="status"></div>
        </div>
      </div>
    </section>

    <section id="app-view" class="hidden">
      <div class="app-heading">
        <div><p class="eyebrow">Your workspace</p><h1>Today, in focus.</h1><p id="user-email" class="user-line"></p></div>
      </div>
      <div class="workspace">
        <form id="task-form" class="task-form">
          <h2>Add a task</h2>
          <div class="form-stack">
            <label>Title<input id="task-title" type="text" maxlength="120" placeholder="What needs doing?" required /></label>
            <label>Description<textarea id="task-description" maxlength="1000" placeholder="A little context, if useful..."></textarea></label>
            <label>Importance<select id="task-priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label>
            <label>Due date<input id="task-due-date" type="date" /></label>
            <button class="button" type="submit">Add task</button>
          </div>
        </form>
        <section class="task-list" aria-labelledby="tasks-heading">
          <div class="list-header"><h2 id="tasks-heading">Your tasks</h2><label class="sort-control">Sort by<select id="task-sort"><option value="created">Recently added</option><option value="priority">Importance</option><option value="due_date">Due date</option></select></label><span id="task-count" class="task-count"></span></div>
          <div id="tasks"><p class="loading">Loading your tasks...</p></div>
        </section>
      </div>
      <div id="task-message" class="notice hidden" role="status"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script type="text/plain">
    // Replace these placeholders with your Supabase project's values.
    const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authView = document.querySelector('#auth-view');
    const appView = document.querySelector('#app-view');
    const logoutButton = document.querySelector('#logout-button');
    const authMessage = document.querySelector('#auth-message');
    const taskMessage = document.querySelector('#task-message');
    const tasksElement = document.querySelector('#tasks');
    const taskCount = document.querySelector('#task-count');
    let currentUser = null;

    function showMessage(element, message, type = '') {
      element.textContent = message;
      element.className = `notice ${type}`.trim();
    }

    function clearMessage(element) {
      element.textContent = '';
      element.className = 'notice hidden';
    }

    function setAuthenticated(user) {
      currentUser = user;
      const isLoggedIn = Boolean(user);
      authView.classList.toggle('hidden', isLoggedIn);
      appView.classList.toggle('hidden', !isLoggedIn);
      logoutButton.classList.toggle('hidden', !isLoggedIn);
      if (isLoggedIn) {
        document.querySelector('#user-email').textContent = user.email;
        fetchTasks();
      } else {
        tasksElement.innerHTML = '';
        clearMessage(taskMessage);
      }
    }

    function renderTasks(tasks) {
      taskCount.textContent = `${tasks.length} ${tasks.length === 1 ? 'task' : 'tasks'}`;
      if (!tasks.length) {
        tasksElement.innerHTML = '<p class="empty">Nothing here yet. Add the first thing to your list.</p>';
        return;
      }
      tasksElement.innerHTML = tasks.map((task) => `
        <article class="task ${task.is_completed ? 'completed' : ''}" data-task-id="${task.id}">
          <input class="task-check" type="checkbox" ${task.is_completed ? 'checked' : ''} aria-label="Mark ${escapeHtml(task.title)} as complete" />
          <div><p class="task-title">${escapeHtml(task.title)}</p>${task.description ? `<p class="task-description">${escapeHtml(task.description)}</p>` : ''}</div>
          <div class="task-actions"><button class="icon-button edit-task" type="button">Edit</button><button class="icon-button delete-task" type="button">Delete</button></div>
        </article>`).join('');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    }

    async function fetchTasks() {
      if (!currentUser) return;
      tasksElement.innerHTML = '<p class="loading">Loading your tasks...</p>';
      const { data, error } = await supabaseClient.from('tasks').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
      if (error) { showMessage(taskMessage, error.message, 'error'); return; }
      clearMessage(taskMessage);
      renderTasks(data || []);
    }

    document.querySelector('#task-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessage(taskMessage);
      const titleInput = document.querySelector('#task-title');
      const descriptionInput = document.querySelector('#task-description');
      const { error } = await supabaseClient.from('tasks').insert({ user_id: currentUser.id, title: titleInput.value.trim(), description: descriptionInput.value.trim(), is_completed: false });
      if (error) { showMessage(taskMessage, error.message, 'error'); return; }
      event.target.reset();
      await fetchTasks();
    });

    tasksElement.addEventListener('click', async (event) => {
      const taskElement = event.target.closest('.task');
      if (!taskElement) return;
      const taskId = taskElement.dataset.taskId;
      if (event.target.classList.contains('delete-task')) {
        const { error } = await supabaseClient.from('tasks').delete().eq('id', taskId).eq('user_id', currentUser.id);
        if (error) showMessage(taskMessage, error.message, 'error'); else await fetchTasks();
      }
      if (event.target.classList.contains('edit-task')) {
        const title = window.prompt('Edit task title:', taskElement.querySelector('.task-title').textContent);
        if (title === null || !title.trim()) return;
        const { error } = await supabaseClient.from('tasks').update({ title: title.trim() }).eq('id', taskId).eq('user_id', currentUser.id);
        if (error) showMessage(taskMessage, error.message, 'error'); else await fetchTasks();
      }
    });

    tasksElement.addEventListener('change', async (event) => {
      if (!event.target.classList.contains('task-check')) return;
      const taskId = event.target.closest('.task').dataset.taskId;
      const { error } = await supabaseClient.from('tasks').update({ is_completed: event.target.checked }).eq('id', taskId).eq('user_id', currentUser.id);
      if (error) { showMessage(taskMessage, error.message, 'error'); await fetchTasks(); } else await fetchTasks();
    });

    document.querySelectorAll('[data-auth-tab]').forEach((tab) => tab.addEventListener('click', () => {
      const isLogin = tab.dataset.authTab === 'login';
      document.querySelectorAll('[data-auth-tab]').forEach((item) => item.classList.toggle('active', item === tab));
      document.querySelector('#login-form').classList.toggle('hidden', !isLogin);
      document.querySelector('#signup-form').classList.toggle('hidden', isLogin);
      clearMessage(authMessage);
    }));

    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault(); clearMessage(authMessage);
      const { error } = await supabaseClient.auth.signInWithPassword({ email: document.querySelector('#login-email').value, password: document.querySelector('#login-password').value });
      if (error) showMessage(authMessage, error.message, 'error');
    });

    document.querySelector('#signup-form').addEventListener('submit', async (event) => {
      event.preventDefault(); clearMessage(authMessage);
      const { data, error } = await supabaseClient.auth.signUp({ email: document.querySelector('#signup-email').value, password: document.querySelector('#signup-password').value });
      if (error) showMessage(authMessage, error.message, 'error');
      else if (data.session) setAuthenticated(data.session.user);
      else showMessage(authMessage, 'Check your email to confirm your account, then log in.', 'success');
    });

    logoutButton.addEventListener('click', async () => {
      const { error } = await supabaseClient.auth.signOut();
      if (error) showMessage(taskMessage, error.message, 'error');
    });

    supabaseClient.auth.onAuthStateChange((_event, session) => setAuthenticated(session?.user || null));
    supabaseClient.auth.getSession().then(({ data }) => setAuthenticated(data.session?.user || null));
  </script>
</body>
</html>
